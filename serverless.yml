org: osvaldobazzanbini
service: formsbuilder

provider:
  name: aws
  runtime: nodejs20.x
  architecture: arm64
  memorySize: 128
  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - dynamodb:Query
            - dynamodb:GetItem
            - dynamodb:PutItem
            - dynamodb:UpdateItem
            - dynamodb:DeleteItem
          Resource: "arn:aws:dynamodb:${aws:region}:${aws:accountId}:table/FormsBuilderTable"
        - Effect: Allow
          Action:
            - cognito-idp:AdminGetUser
          Resource: !GetAtt FormsBuilderUserPool.Arn
  environment:
      COGNITO_CLIENT_ID: !Ref FormsBuilderUserPoolClient
      COGNITO_POOL_ID: !Ref FormsBuilderUserPool
  httpApi:
    authorizers: 
      CognitoAuthorizer:
        type: jwt
        identitySource: $request.header.Authorization
        issuerUrl: !GetAtt FormsBuilderUserPool.ProviderURL
        audience:
          - !Ref FormsBuilderUserPoolClient
    cors:
      allowedOrigins:
        - http://localhost:5173
      allowedMethods:
        - GET
        - POST
        - PUT
        - DELETE
        - OPTIONS

package:
  individually: true
  patterns:
    - '!**.spec.ts'

build:
  esbuild:
    bundle: true
    minify: true
    exclude: 
      - '@aws-sdk/*'

functions:
  
  # Authentication
  sign-up-service:
    handler: src/infra/use-cases/auth/signUp/signUp.handler
    events:
      - httpApi:
          path: /auth/signup
          method: POST
  
  sign-in-service:
    handler: src/infra/use-cases/auth/signIn/signIn.handler
    events:
      - httpApi:
          path: /auth/signin
          method: POST
  
  account-confirmation-service:
    handler: src/infra/use-cases/auth/accountConfirmation/accountConfirmation.handler
    events:
      - httpApi:
          path: /auth/account-confirmation
          method: POST
  
  resend-confirmation-code-service:
    handler: src/infra/use-cases/auth/accountConfirmation/resendConfirmationCode.handler
    events:
      - httpApi:
          path: /auth/resend-confirmation-code
          method: POST

  change-password-confirmation-code-service:
    handler: src/infra/use-cases/auth/changePassword/changePasswordConfirmationCode.handler
    events:
      - httpApi:
          path: /auth/password/forgot
          method: POST

  change-password-service:
    handler: src/infra/use-cases/auth/changePassword/changePassword.handler
    events:
      - httpApi:
          path: /auth/password/reset
          method: POST
  
  refresh-token-service:
    handler: src/infra/use-cases/auth/refreshToken/refreshToken.handler
    events:
      - httpApi:
          path: /auth/refresh-token
          method: POST

  cognito-custom-message:
    handler: src/infra/use-cases/auth/customMessage/index.handler
    events:
      - cognitoUserPool:
          pool: FormsBuilderUserPool
          trigger: CustomMessage
          existing: true
          forceDeploy: true

  get-profile-service:
    handler: src/infra/use-cases/profile/me/me.handler
    events:
      - httpApi:
          path: /profile/me
          method: GET
          authorizer: 
            name: CognitoAuthorizer
 
  create-customer-service:
    handler: src/infra/use-cases/customers/createCustomer/createCustomer.handler
    events:
      - httpApi:
          path: /companies/{companyId}/customers
          method: POST
          authorizer: 
            name: CognitoAuthorizer
  
  update-customer-service:
    handler: src/infra/use-cases/customers/updateCustomer/updateCustomer.handler
    events:
      - httpApi:
          path: /companies/{companyId}/customers/{customerId}
          method: PUT
          authorizer: 
            name: CognitoAuthorizer
  
  get-customers-service:
    handler: src/infra/use-cases/customers/getCustomers/getCustomers.handler
    events:
      - httpApi:
          path: /companies/{companyId}/customers
          method: GET
          authorizer: 
            name: CognitoAuthorizer

  create-company-service:
    handler: src/infra/use-cases/company/createCompany/createCompany.handler
    events:
      - httpApi:
          path: /companies
          method: POST
          authorizer: 
            name: CognitoAuthorizer
  
  get-companies-service:
    handler: src/infra/use-cases/company/getCompanies/getCompanies.handler
    events:
      - httpApi:
          path: /companies
          method: GET
          authorizer: 
            name: CognitoAuthorizer

  create-form-service:
    handler: src/infra/use-cases/forms/createForm/createForm.handler
    events:
      - httpApi:
          path: /forms
          method: POST
          authorizer: 
            name: CognitoAuthorizer
    environment:
      FIELDS_BUCKET: !Ref S3Bucket

  get-forms-service:
    handler: src/infra/use-cases/forms/getForms/getForms.handler
    events:
      - httpApi:
          path: /forms
          method: GET
          authorizer: 
            name: CognitoAuthorizer


resources:
  Resources:

    S3Bucket:
      Type: AWS::S3::Bucket
      Properties:
        BucketName: forms-builder-fields-bucket

    FormsBuilderTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: FormsBuilderTable
        BillingMode: PAY_PER_REQUEST
        PointInTimeRecoverySpecification:
          PointInTimeRecoveryEnabled: true
        AttributeDefinitions:
          - AttributeName: PK
            AttributeType: S
          - AttributeName: SK
            AttributeType: S
          # - AttributeName: GSI1PK
          #   AttributeType: S
          # - AttributeName: GSI1SK
          #   AttributeType: S
        KeySchema:
          - AttributeName: PK
            KeyType: HASH
          - AttributeName: SK
            KeyType: RANGE
        # GlobalSecondaryIndexes:
        #   - IndexName: GSI1
        #     KeySchema:
        #       - AttributeName: GSI1PK
        #         KeyType: HASH
        #       - AttributeName: GSI1SK
        #         KeyType: RANGE
        #     Projection:
        #       ProjectionType: ALL
        DeletionProtectionEnabled: true

    FormsBuilderUserPool:
      Type: AWS::Cognito::UserPool
      Properties:
        DeletionProtection: ACTIVE
        UserPoolName: FormsBuilderUserPool
        MfaConfiguration: OFF
        AutoVerifiedAttributes: 
          - email
        AdminCreateUserConfig:
          AllowAdminCreateUserOnly: false
        UsernameAttributes:
          - email
        AccountRecoverySetting:
          RecoveryMechanisms: 
            - Name: verified_email
              Priority: 1
        Policies:
          PasswordPolicy: 
            MinimumLength: 8
            RequireLowercase: true
            RequireNumbers: true
            RequireUppercase: true
            TemporaryPasswordValidityDays: 2
        Schema:
          - Name: given_name
            Mutable: true
            Required: true
            AttributeDataType: String

    FormsBuilderUserPoolClient:
      Type: AWS::Cognito::UserPoolClient
      Properties:
        ClientName: FormsBuilderUserPoolClient
        UserPoolId: !Ref FormsBuilderUserPool
        ExplicitAuthFlows:
          - ALLOW_USER_PASSWORD_AUTH
          - ALLOW_REFRESH_TOKEN_AUTH
        AccessTokenValidity: 3
        RefreshTokenValidity: 48 # 2 days
        TokenValidityUnits:
          AccessToken: hours
          RefreshToken: hours 